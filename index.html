    let navigationsVerlauf = [];

    function zeigeKategorienUebersicht() {
      navigationsVerlauf = [];
      document.getElementById('back-btn').style.display = 'none';
      document.getElementById('home-btn').style.display = 'none';
      document.getElementById('search-container').style.display = 'block';

      let html = `
        <h2>Kategorie auswählen</h2>
        <div class="grid">
          <button class="btn kat-btn" onclick="zeigeHerstellerNachKategorie('buehne')">🚀 Arbeitsbühnen</button>
          <button class="btn kat-btn" onclick="zeigeHerstellerNachKategorie('stapler')">🚜 Stapler & Kettenbühnen</button>
        </div>
      `;
      document.getElementById('app').innerHTML = html;
    }

    function zeigeHerstellerNachKategorie(katId) {
      navigationsVerlauf.push({ typ: 'kategorie', wert: katId });
      document.getElementById('back-btn').style.display = 'block';
      document.getElementById('home-btn').style.display = 'block';

      const titel = katId === 'buehne' ? 'Arbeitsbühnen' : 'Stapler & Kettenbühnen';
      let html = `<h2>Hersteller (${titel})</h2><div class="grid">`;
      
      for (const key in portalDaten) {

const hersteller = portalDaten[key];if (hersteller.kategorie === katId) {html += <button class="btn hersteller-btn" style="border-left-color: ${hersteller.farbe}" onclick="waehleHersteller('${key}')"> 🏢 ${hersteller.name} </button>;}}html += '';document.getElementById('app').innerHTML = html;}function waehleHersteller(key) {navigationsVerlauf.push({ typ: 'hersteller', wert: key });document.getElementById('back-btn').style.display = 'block';document.getElementById('home-btn').style.display = 'block';const hersteller = portalDaten[key];let html = <h2>${hersteller.name} - Modelle</h2><div class="grid">;for (const maschine in hersteller.maschinen) {html += <button class="btn maschine-btn" onclick="waehleMaschine('${key}', '${maschine}')"> 📦 ${maschine} </button>;}html += '';document.getElementById('app').innerHTML = html;}function waehleMaschine(herstellerKey, maschineKey) {navigationsVerlauf.push({ typ: 'maschine', hersteller: herstellerKey, maschine: maschineKey });const dokumente = portalDaten[herstellerKey].maschinen[maschineKey];let html = <h2>${portalDaten[herstellerKey].name} ${maschineKey}</h2><div class="grid">;if (!dokumente || dokumente.length === 0) {html += 'Keine Dokumente für diese Maschine hinterlegt.';} else {dokumente.forEach(doku => {html += <button class="btn maschine-btn" onclick="oeffnePdf('${doku.datei}', '${doku.titel}')"> ${doku.titel} </button>;});}html += '';document.getElementById('app').innerHTML = html;}function oeffnePdf(dateiPfad, titel) {try {document.getElementById('modal-titel').innerText = titel;document.getElementById('pdf-frame').src = dateiPfad;document.getElementById('pdf-modal').style.display = 'flex';} catch (error) {window.open(dateiPfad, '_blank');}}function schliessePdf() {document.getElementById('pdf-modal').style.display = 'none';document.getElementById('pdf-frame').src = '';}function sucheMaschine() {const input = document.getElementById('search-input');if (!input) return;const suchbegriff = input.value.toLowerCase().trim();if (suchbegriff === "") {zeigeKategorienUebersicht();return;}document.getElementById('back-btn').style.display = 'none';document.getElementById('home-btn').style.display = 'none';let html = 'Suchergebnisse';let trefferGefunden = false;for (const hKey in portalDaten) {const hersteller = portalDaten[hKey];if (hersteller.name.toLowerCase().includes(suchbegriff)) {html += <button class="btn hersteller-btn" style="border-left-color: ${hersteller.farbe}" onclick="waehleHersteller('${hKey}')"> 🏢 ${hersteller.name} (Hersteller) </button>;trefferGefunden = true;}for (const mKey in hersteller.maschinen) {if (mKey.toLowerCase().includes(suchbegriff)) {html += <button class="btn maschine-btn" onclick="waehleMaschine('${hKey}', '${mKey}')"> ⚙️ ${hersteller.name} - ${mKey} </button>;trefferGefunden = true;}}}if (!trefferGefunden) {html += 'Keine passenden Maschinen oder Hersteller gefunden.';}html += '';document.getElementById('app').innerHTML = html;}function zurueckNavigieren() {const input = document.getElementById('search-input');if (input) input.value = "";navigationsVerlauf.pop();if (navigationsVerlauf.length === 0) {zeigeKategorienUebersicht();} else {const vorherigerZustand = navigationsVerlauf[navigationsVerlauf.length - 1];navigationsVerlauf.pop();if (vorherigerZustand.typ === 'kategorie') {zeigeHerstellerNachKategorie(vorherigerZustand.wert);} else if (vorherigerZustand.typ === 'hersteller') {waehleHersteller(vorherigerZustand.wert);}}}function zurueckZurUebersicht() {const input = document.getElementById('search-input');if (input) input.value = "";zeigeKategorienUebersicht();}// Erzwingt das sofortige Laden, sobald der HTML-Body bereit istwindow.onload = function() {const input = document.getElementById('search-input');if (input) input.value = "";zeigeKategorienUebersicht();};
