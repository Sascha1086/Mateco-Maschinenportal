
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mateco-Maschinenportal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div id="nav-buttons">
            <button id="back-btn" style="display: none;" onclick="zurueckNavigieren()">⬅️ Zurück</button>
            <button id="home-btn" style="display: none;" onclick="zurueckZurUebersicht()">🏠 Home</button>
        </div>
        <h1 id="portal-titel" onclick="zurueckZurUebersicht()">🔧 Mateco-Maschinenportal</h1>
    </header>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="🔍 Maschine oder Hersteller suchen..." oninput="sucheMaschine()">
    </div>

    <main id="app">
        <!-- Inhalte kommen aus der script.js -->
    </main>

    <!-- Das ?v=100 zwingt den Browser-Cache, die neuen Hersteller sofort zu laden! -->
    <script src="script.js?v=100"></script>
</body>
</html>
