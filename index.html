<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mateco-Maschinenportal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div id="nav-buttons">
            <button id="back-btn" style="display: none;" onclick="zurueckNavigieren()">⬅️ Zurück</button>
            <button id="home-btn" style="display: none;" onclick="zurueckZurUebersicht()">🏠 Home</button>
        </div>
        <h1 id="portal-titel" onclick="zurueckZurUebersicht()">🔧 Mateco-Maschinenportal</h1>
    </header>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="🔍 Maschine oder Hersteller suchen..." oninput="sucheMaschine()">
    </div>

    <main id="app">
        <!-- Inhalte kommen live aus der script.js -->
    </main>

    <!-- Das PDF-Modal für die integrierte Dokumenten-Vorschau -->
    <div id="pdf-modal" class="modal" style="display: none;">
        <div class="modal-header">
            <span id="modal-titel">Dokument</span>
            <button class="close-btn" onclick="schliessePdf()">❌ Schließen</button>
        </div>
        <div class="modal-body">
            <iframe id="pdf-frame" src="" frameborder="0"></iframe>
        </div>
    </div>

    <!-- Das ?v=102 zwingt den Browser-Cache, die korrigierte Datei sofort zu laden! -->
    <script src="script.js?v=102"></script>
</body>
</html>
